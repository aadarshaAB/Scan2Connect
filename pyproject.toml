[project]
name = "scan2connect"
version = "0.1.0"
description = "Scan a WiFi QR code with a webcam and connect the PC to that network"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.8",
    "pyzbar>=0.1.9",
    "pywifi>=1.1.12",
    "comtypes>=1.4.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.2",
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scan2connect*"]

[tool.setuptools.package-data]
scan2connect = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
