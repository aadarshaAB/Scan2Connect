name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Read version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build onedir exe
        run: pyinstaller packaging/scan2connect.spec

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} packaging\installer.iss

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Scan2Connect\*" -DestinationPath "dist\Scan2Connect-${{ steps.version.outputs.version }}-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: scan2connect-installer
          path: dist\*-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: scan2connect-portable
          path: dist\*-portable.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist\*-setup.exe
            dist\*-portable.zip
